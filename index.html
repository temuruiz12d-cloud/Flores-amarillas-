<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ✨</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* Evita que se seleccione texto al tocar rápido */
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #fce4ec; /* Fondo rosita pastel */
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow: hidden; /* Evita barras de desplazamiento al flotar emojis */
            position: relative;
        }

        /* Botón de inicio */
        #startBtn {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 64, 129, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            z-index: 10;
        }
        #startBtn:active {
            transform: scale(0.95);
        }

        /* Contenedores y animación de desvanecimiento */
        .hidden {
            display: none;
            opacity: 0;
        }
        .fade-in {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: aparecer 1.5s forwards;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilos de los mensajes */
        h1 {
            color: #d81b60;
            font-size: 28px;
            margin-bottom: 20px;
            line-height: 1.3;
        }
        h2 {
            color: #c2185b;
            font-size: 22px;
            margin-top: 20px;
            line-height: 1.4;
            max-width: 350px;
        }

        /* Lienzo del ramo de flores */
        canvas {
            background: transparent;
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.15));
        }

        /* Emojis flotantes al hacer clic / toque */
        .click-emoji {
            position: fixed;
            pointer-events: none; /* No estorba los clics */
            font-size: 28px;
            z-index: 9999;
            animation: flotarYDesaparecer 1.2s ease-out forwards;
        }

        @keyframes flotarYDesaparecer {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5) translateY(0);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2) translateY(-30px);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1) translateY(-70px);
            }
        }
    </style>
</head>
<body>

    <!-- Botón inicial -->
    <button id="startBtn">Start ❤️</button>

    <!-- Paso 1: Primer mensaje -->
    <div id="step1" class="hidden">
        <h1>solo por q eres la niña más bonita ✨🥺</h1>
    </div>

    <!-- Paso 2: Ramo dibujado por JavaScript -->
    <div id="step2" class="hidden">
        <canvas id="ramoCanvas" width="340" height="360"></canvas>
        <h2>te las mereces, estas y todas las flores del mundo preciosa 💛</h2>
    </div>

<script>
    // Lógica del botón Start y secuencia
    document.getElementById('startBtn').addEventListener('click', function(e) {
        e.stopPropagation(); // Evita duplicar el efecto al dar clic en el botón
        this.style.display = 'none';

        // Mostrar primer texto
        const step1 = document.getElementById('step1');
        step1.classList.remove('hidden');
        step1.classList.add('fade-in');

        // Después de 3.5 segundos, mostrar el ramo armado
        setTimeout(function() {
            const step2 = document.getElementById('step2');
            step2.classList.remove('hidden');
            step2.classList.add('fade-in');
            dibujarRamoArmado();
        }, 3500);
    });

    // Evento para crear flor y corazón al tocar/hacer clic en la pantalla
    window.addEventListener('pointerdown', function(e) {
        crearEfectoClick(e.clientX, e.clientY);
    });

    function crearEfectoClick(x, y) {
        const elementos = ['🌻', '💛']; // Flor amarilla y corazón

        elementos.forEach((emoji, index) => {
            const el = document.createElement('div');
            el.className = 'click-emoji';
            el.innerText = emoji;

            // Desplazar un poco la flor a la izquierda y el corazón a la derecha
            const offsetX = (index === 0 ? -18 : 18) + (Math.random() * 8 - 4);
            const offsetY = (Math.random() * 10 - 5);

            el.style.left = (x + offsetX) + 'px';
            el.style.top = (y + offsetY) + 'px';

            document.body.appendChild(el);

            // Eliminar elemento después de que termina la animación
            setTimeout(() => {
                el.remove();
            }, 1200);
        });
    }

    // Dibujo del ramo en Canvas
    function dibujarRamoArmado() {
        const canvas = document.getElementById('ramoCanvas');
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Tallos
        ctx.strokeStyle = '#2e7d32';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';

        const tallos = [
            { x1: 170, y1: 220, x2: 150, y2: 320 },
            { x1: 120, y1: 200, x2: 160, y2: 320 },
            { x1: 220, y1: 200, x2: 180, y2: 320 },
            { x1: 90,  y1: 170, x2: 165, y2: 320 },
            { x1: 250, y1: 170, x2: 175, y2: 320 },
            { x1: 170, y1: 150, x2: 170, y2: 320 }
        ];

        tallos.forEach(t => {
            ctx.beginPath();
            ctx.moveTo(t.x1, t.y1);
            ctx.quadraticCurveTo((t.x1 + t.x2) / 2, (t.y1 + t.y2) / 2 + 10, t.x2, t.y2);
            ctx.stroke();
        });

        // 2. Hojas
        dibujarHoja(ctx, 110, 240, -0.6);
        dibujarHoja(ctx, 230, 240, 0.6);
        dibujarHoja(ctx, 130, 210, -0.8);
        dibujarHoja(ctx, 210, 210, 0.8);

        // 3. Flores amarillas
        dibujarGirasol(ctx, 100, 160, 28, 12, '#fbc02d', '#f57f17');
        dibujarGirasol(ctx, 240, 160, 28, 12, '#fbc02d', '#f57f17');
        dibujarGirasol(ctx, 125, 110, 32, 14, '#ffeb3b', '#f57f17');
        dibujarGirasol(ctx, 215, 110, 32, 14, '#ffeb3b', '#f57f17');
        dibujarGirasol(ctx, 170, 85,  35, 14, '#ffee58', '#f57f17');

        // Flores centrales
        dibujarGirasol(ctx, 170, 150, 40, 16, '#ffeb3b', '#e65100');
        dibujarGirasol(ctx, 170, 210, 25, 10, '#fff176', '#f57f17');

        // 4. Moño Rojo
        dibujarMonoRojo(ctx, 170, 280);

        // 5. Destellos
        dibujarDestellos(ctx);
    }

    function dibujarGirasol(ctx, cx, cy, radio, numPetalos, colorPetalo, colorCentro) {
        ctx.save();
        ctx.translate(cx, cy);

        ctx.fillStyle = colorPetalo;
        ctx.strokeStyle = '#f57f17';
        ctx.lineWidth = 1;

        for (let i = 0; i < numPetalos; i++) {
            const angulo = (Math.PI * 2 / numPetalos) * i;
            ctx.rotate(angulo);
            ctx.beginPath();
            ctx.ellipse(radio * 0.75, 0, radio * 0.6, radio * 0.22, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.rotate(-angulo);
        }

        ctx.beginPath();
        ctx.arc(0, 0, radio * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = colorCentro;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#bf360c';
        ctx.stroke();

        ctx.restore();
    }

    function dibujarHoja(ctx, x, y, angulo) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angulo);
        ctx.fillStyle = '#388e3c';
        ctx.beginPath();
        ctx.ellipse(0, 0, 25, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function dibujarMonoRojo(ctx, x, y) {
        ctx.fillStyle = '#e91e63';
        ctx.strokeStyle = '#c2185b';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(x - 5, y);
        ctx.lineTo(x - 20, y + 35);
        ctx.lineTo(x - 5, y + 30);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x + 5, y);
        ctx.lineTo(x + 20, y + 35);
        ctx.lineTo(x + 5, y + 30);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(x - 22, y - 5, 20, 12, -Math.PI / 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(x + 22, y - 5, 20, 12, Math.PI / 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(x, y, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#ff4081';
        ctx.fill();
        ctx.stroke();
    }

    function dibujarDestellos(ctx) {
        ctx.fillStyle = '#ffd54f';
        const puntos = [
            {x: 60, y: 100}, {x: 280, y: 90}, 
            {x: 80, y: 220}, {x: 270, y: 210},
            {x: 170, y: 30}
        ];
        puntos.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
        });
    }
</script>

</body>
</html>
